variables:
  GIT_SUBMODULE_STRATEGY: none      # Do not automatically clone submodules before each job (done in before_script)
  GIT_STRATEGY: clone               # Clone repo for every pipeline (seems to avoid weird errors due to submodule worktrees becoming out of sync)
  GIT_DEPTH: "3"                    # Shallow clone to speed up build

stages:
    - build

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

.default_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never

.variables_ppp: &vars-ppp
    ORD_SOUMET_MACH: "ppp5"         # Machine name
    ORD_SOUMET_C:    "40"           # Number of CPUs to use
    ORD_SOUMET_T:    "600"          # Wallclock time (seconds)
    ORD_SOUMET_CM:   "8G"           # Memory
    ORD_SOUMET_Q:    "development"  # Queue
    ARCH_NAME: intel

.variables_super: &vars-super
    ORD_SOUMET_MACH: "underhill"
    ORD_SOUMET_C:    "80"           # Use more than 75% of one node's CPUs (80) to avoid ord_soumet's waste prevention
    ORD_SOUMET_T:    "3600"
    ORD_SOUMET_CM:   "8G"
    ORD_SOUMET_Q:    "development"
    ARCH_NAME: intel

.variables_cice: &vars-cice
    ICE_DRVOPT: "standalone/cice"

.vars_libcice: &vars-libcice
    ICE_DRVOPT: "direct/nemo_concepts"
    ICE_CPPDEFS: "-DCICE_IN_NEMO"
    ICE_EXT:     ".a"

before_script:
  - git submodule update --init --recursive ||
    git -c url.https://gitlab.science.gc.ca/$CI_PROJECT_NAMESPACE/.insteadOf=https://gitlab.science.gc.ca/concepts/ submodule update --init --recursive --force ||
    git submodule update --init --recursive --force

.matrix_machine: &matrix-machine
  MACHINE: ["ppp"] #, "sc"]
.matrix_target: &matrix-target
  TARGET:  ["cice", "libcice"]

.parallel:
  parallel:
    matrix:
      - <<: *matrix-machine
        <<: *matrix-target

setup:
  stage: .pre
  rules:
    - !reference [.default_rules, rules]
    - if: '$TARGET == "cice"'
      variables:
        <<: *vars-cice
    - if: '$TARGET == "libcice"'
      variables:
        <<: *vars-libcice
  parallel:
    matrix:
      - <<: *matrix-target
  variables:
    GIT_STRATEGY: none
  before_script: []
  script:
    - env | grep ^ICE_ >> $TARGET.env
  artifacts:
    paths:
      - $TARGET.env
    expire_in: 1 hour

build:
  stage: build
  rules:
    - !reference [.default_rules, rules]
    - if: '$MACHINE == "ppp"'
      variables:
        <<: *vars-ppp
    - if: '$MACHINE == "sc"'
      variables:
        <<: *vars-super
  extends: .parallel
  script:
    - source $TARGET.env
    - ./cice.setup -m $ORD_SOUMET_MACH -e $ARCH_NAME -c ci
    - echo "setenv ICE_RUNDIR  $PWD/build"   >>ci.settings
    - echo "setenv ICE_DRVOPT  $ICE_DRVOPT"  >>ci.settings
    - echo "setenv ICE_CPPDEFS $ICE_CPPDEFS" >>ci.settings
    - ./ci/casescripts/parse_settings.sh  ci/*.settings ci.settings
    - cd ci && ./cice.build $TARGET EXEC="${TARGET}${ICE_EXT}"

mirror-consortium:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    <<: *vars-ppp
  before_script: []
  script:
    - git branch --delete --remote $(git for-each-ref refs/remotes/origin --format='%(refname:short)')
    - git remote add --mirror=fetch consortium https://github.com/CICE-Consortium/CICE.git
    - https_proxy=http://webproxy.science.gc.ca:8888/ git fetch consortium
    - git config remote.origin.fetch "+refs/*:refs/*"
    - git config remote.origin.url https://unused-account:$CONSORTIUM_MIRRORING@$CI_SERVER_HOST/$CI_PROJECT_PATH.git
    - git push -o ci.skip --all --verbose origin
